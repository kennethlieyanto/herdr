onboarding = false

[ui]
agent_panel_scope = "all"
host_cursor = "native"
agent_panel_sort = "priority"

[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+a"
switch_tab = "alt+1..9"
switch_workspace = "prefix+1..9"
focus_agent = "alt+shift+1..9"
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", "prefix+\""]
goto = ""
workspace_picker = "prefix+w"
settings = "prefix+shift+s"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"
swap_pane_right = "prefix+alt+l"
toggle_sidebar = "prefix+e"
edit_scrollback = "prefix+shift+e"
rename_tab = "prefix+,"
rename_workspace = "prefix+$"
detach = "prefix+d"
last_pane = "prefix+L"
next_tab = ""

[[keys.command]]
key = "prefix+n"
type = "popup"
command = "herdr-task-picker worktree"
description = "taskwarrior task -> worktree workspace"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-task-picker tab"
description = "taskwarrior task -> tab"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "herdr-workspace-picker"
description = "switch herdr workspace"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "herdr-agent-picker"
description = "focus herdr agent"
width = "90%"
height = "90%"

[theme]
name = "vesper"
